services:
  esteira:
    build: .
    image: social-hub-worker
    container_name: social-hub-worker
    restart: unless-stopped
    env_file: .env
    ports:
      # Só no loopback da VPS. A fila revela quanto você gasta, e a API não tem
      # autenticação — quem precisar ver de fora, põe atrás do proxy da Hostinger.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Só o /saude, que não toca o banco: uma oscilação do Postgres não pode
      # derrubar um container que está perfeitamente vivo.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Um render é ffmpeg em todos os núcleos. Sem teto, ele engasga a VPS
    # inteira e o painel na Vercel começa a dar timeout junto.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
